# nginx site for the CRM served at the ROOT of its own domain.
#
# deploy/setup-server.sh installs this as /etc/nginx/sites-available/zenkara-crm
# with __DOMAIN__ replaced. HTTP only until deploy/enable-https.sh has run;
# certbot then adds the `listen 443 ssl` block and turns this into a redirect.
# Camera / geolocation / PWA features do not work over plain HTTP.
#
# The static root is the CI-built bundle the puller unpacks
# (deploy/zenkara-pull-deploy.sh); the API runs on 127.0.0.1:4000 under
# systemd (zenkara-crm-api.service) and is never exposed directly.

server {
    listen 80;
    server_name __DOMAIN__;

    root /opt/zenkara-crm/client/dist;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json;

    # Security headers. NOTE: nginx's add_header is NOT inherited into any
    # location that declares its own add_header, so these are repeated in
    # those locations below — keep the lists in sync.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # ^~ is required: without it the asset-caching regex below wins for any
    # API URL ending in .png/.js (avatars, attachments) and it 404s as a
    # static file instead of being proxied.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # SSE (/api/events/stream) must stream, and idle gaps between
        # events must not hit the default 60s read timeout.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Never cache the app shell, service worker or manifest — a stale copy
    # points at hashed chunks purged by the next deploy (the white screen).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Which release is live — read by the Deploy workflow's health check.
    location = /deployed.txt {
        add_header Cache-Control "no-cache" always;
    }

    # Face-verification model weights: explicit 404 (not index.html) when a
    # file is missing, so a broken build fails loudly instead of feeding
    # face-api an HTML page.
    location ^~ /models/ {
        try_files $uri =404;
        types { application/json json; application/octet-stream bin; }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — React Router resolves the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed filenames, so these are safe to cache hard.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
